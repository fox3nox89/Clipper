# Kopiere diese Datei nach config.yaml und passe sie an.
# Trage NUR Streamer ein, für die du an einer offiziellen Clipping-Kampagne teilnimmst
# (z. B. auf contentrewards.com) – sonst verletzt du Urheberrechte und wirst nicht bezahlt.

streamers:
  # ─────────────────────────────────────────────────────────────────────
  # So funktioniert die Liste:
  #   enabled: true   = wird überwacht
  #   enabled: false  = wird ignoriert
  # Schalte einen Streamer erst auf true, wenn du bei einer laufenden
  # Clipping-Kampagne für ihn angemeldet bist (z. B. contentrewards.com).
  #
  # facecam fehlt überall absichtlich: Die Position ist bei jedem Streamer
  # anders. Ohne facecam gibt es Hochformat mit unscharfem Hintergrund.
  # Für "Facecam oben, Spiel unten" einmal ablesen:
  #   python -m clipper snapshot https://www.twitch.tv/<kanal>
  # und z. B. "facecam: [0.0, 0.0, 0.3, 0.3]" ergänzen.
  # ─────────────────────────────────────────────────────────────────────

  # ── Aus dem TikTok-Video (dort mit Clipping-Kampagne gezeigt) ──
  - {name: lacy,        platform: twitch, channel: lacy,          enabled: true}
  - {name: clix,        platform: twitch, channel: clix,          enabled: true}
  - {name: dom,         platform: kick,   channel: dom,           enabled: false}  # Kanalname auf kick.com prüfen
  - {name: tomo,        platform: twitch, channel: tomo,          enabled: false}  # Plattform/Kanal prüfen

  # ── Kick-Kampagne zum GTA-6-Stream (laut Ruckus Clipping) ──
  - {name: dasgasd3m,   platform: kick,   channel: dasgasd3m,     enabled: false}

  # ── Große Streamer, die oft geclippt werden: Kampagne prüfen ──
  - {name: kaicenat,    platform: twitch, channel: kaicenat,      enabled: false}
  - {name: jynxzi,      platform: twitch, channel: jynxzi,        enabled: false}
  - {name: caseoh,      platform: twitch, channel: caseoh_,       enabled: false}
  - {name: stableronaldo, platform: twitch, channel: stableronaldo, enabled: false}
  - {name: nickmercs,   platform: twitch, channel: nickmercs,     enabled: false}
  - {name: tfue,        platform: twitch, channel: tfue,          enabled: false}
  - {name: sketch,      platform: twitch, channel: sketch,        enabled: false}
  - {name: xqc,         platform: kick,   channel: xqc,           enabled: false}
  - {name: adinross,    platform: kick,   channel: adinross,      enabled: false}
  - {name: trainwreckstv, platform: kick, channel: trainwreckstv, enabled: false}
  - {name: sweatergxd,  platform: kick,   channel: sweatergxd,    enabled: false}

  # ── Deutschsprachig: Kampagne prüfen ──
  - {name: papaplatte,  platform: twitch, channel: papaplatte,    enabled: false}
  - {name: montanablack, platform: twitch, channel: montanablack88, enabled: false}
  - {name: trymacs,     platform: twitch, channel: trymacs,       enabled: false}
  - {name: knossi,      platform: twitch, channel: knossi,        enabled: false}

detection:
  window_seconds: 10      # "Hype"-Zeitfenster
  multiplier: 3.0         # wie viel mehr Chat als normal ein Highlight ist
  min_messages: 25        # Mindestanzahl Nachrichten im Fenster (für kleine Streams senken)
  cooldown_seconds: 90    # Mindestabstand zwischen zwei Clips

clip:
  before_seconds: 30      # Sekunden vor dem Hype-Moment
  after_seconds: 10       # Sekunden danach
  facecam_height: 640     # Höhe der Facecam oben (von 1920)
  subtitles: true
  whisper_model: small    # tiny = schnell, medium = genauer
  language: null          # null = automatisch erkennen (Englisch und Deutsch gemischt ok)

output_dir: clips
buffer_dir: buffer
buffer_minutes: 5
check_interval_seconds: 60
quality: best             # oder z. B. "720p60", spart CPU
